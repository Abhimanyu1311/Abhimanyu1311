# Generates the "GitHub Metrics" panel (activity, languages, habits, lines
# of code, etc.) rendered by lowlighter/metrics and commits it to
# assets/metrics.svg, which README.md embeds directly.
#
# 🔧 REPLACE: `user: Abhimanyu1311` below if you fork this for another account.
#
# Requires secret: METRICS_TOKEN (a classic PAT with `repo` + `read:user` scopes).
# See SETUP.md → "GitHub Metrics" for how to create it.
name: Generate Metrics

on:
  schedule:
    - cron: "0 4 * * *" # daily at 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Render metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Abhimanyu1311
          filename: assets/metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_lines: yes
          plugin_habits: yes
          plugin_habits_charts_type: bars
          config_timezone: Asia/Kolkata
