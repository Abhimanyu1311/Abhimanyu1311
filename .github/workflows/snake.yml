# Generates the animated "contribution snake" that eats your contribution
# graph and pushes the rendered SVGs to a dedicated `output` branch.
#
# 🔧 Nothing to replace here — `github.repository_owner` resolves automatically
# to whichever account this repo lives under.
#
# Requires: none (uses the default GITHUB_TOKEN). See SETUP.md → "Contribution Snake".
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake game SVG
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push output to the `output` branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
